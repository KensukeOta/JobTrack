name: jobtrack-e2e

services:
  db-e2e:
    image: postgres:17
    environment:
      POSTGRES_DB: jobtrack_e2e
      POSTGRES_USER: jobtrack_e2e
      POSTGRES_PASSWORD: jobtrack_e2e
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobtrack_e2e -d jobtrack_e2e"]
      interval: 2s
      timeout: 5s
      retries: 10

  backend-e2e:
    build:
      context: ./backend
    command:
      [
        "sh",
        "-c",
        "uv run alembic upgrade head && uv run fastapi dev app/main.py --host 0.0.0.0",
      ]
    environment:
      DATABASE_URL: postgresql+psycopg://jobtrack_e2e:jobtrack_e2e@db-e2e:5432/jobtrack_e2e
      JWT_SECRET_KEY: e2e-test-secret-key
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      COOKIE_SECURE: "false"
    ports:
      - "8001:8000"
    depends_on:
      db-e2e:
        condition: service_healthy
